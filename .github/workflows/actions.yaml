name: run api_update.py

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *' # Daily at 10:17 UTC

concurrency:
  group: f1nsight-data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Favor consistency over speed and stay well below Jolpica's burst limit.
      F1NSIGHT_API_DELAY_SECONDS: '1.0'
      F1NSIGHT_API_MAX_RETRIES: '6'
    steps:

      - name: checkout repo content
        uses: actions/checkout@v4 # Updated to v4 to resolve node12 deprecation warning

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # install the python version needed
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run updater regression tests
        run: python -m unittest discover -s tests -v
          
      - name: execute py script # run api_update.py
        run: python api_update.py
          
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add drivers constructors races colors driversList.json historicalPoles.json teamLineage.json teamRecords.json scoringSystems.json scoring/
          git diff --cached --quiet || git commit -m "Update published F1 data"
          
      - name: push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master 
